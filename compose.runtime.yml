services:
  granite:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-granite
    cgroup_parent: ai-core.slice
    working_dir: /app
    command: ["-m","/models/granite-4.2-8b-Q4_K_M.gguf","-c","8192","-t","3","--cache-ram","4096","-np","1","--host","/run/ai-core-backend/granite.sock","--port","8080"]
    volumes: ["./models:/models:ro","ai-core-backend-bus:/run/ai-core-backend"]
    cpus: 3
    cpuset: "0-5"
    mem_limit: 9216m
    memswap_limit: 14336m
    restart: "no"

  qwen3:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-qwen3
    cgroup_parent: ai-core.slice
    working_dir: /app
    command: ["-m","/models/Qwen3-8B-Q4_K_M.gguf","-c","8192","-t","3","--cache-ram","4096","-np","1","--host","/run/ai-core-backend/qwen3.sock","--port","8080"]
    volumes: ["./models:/models:ro","ai-core-backend-bus:/run/ai-core-backend"]
    cpus: 3
    cpuset: "0-5"
    mem_limit: 9216m
    memswap_limit: 14336m
    restart: "no"

  ministral:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-ministral
    cgroup_parent: ai-core.slice
    working_dir: /app
    command: ["-m","/models/Ministral-3-8B-Reasoning-2512-Q4_K_M.gguf","-c","8192","-t","3","--cache-ram","4096","-np","1","--host","/run/ai-core-backend/ministral.sock","--port","8080"]
    volumes: ["./models:/models:ro","ai-core-backend-bus:/run/ai-core-backend"]
    cpus: 3
    cpuset: "0-5"
    mem_limit: 9216m
    memswap_limit: 14336m
    restart: "no"

  coder:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-coder
    cgroup_parent: ai-core.slice
    working_dir: /app
    command: ["-m","/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf","-c","8192","-t","3","--cache-ram","4096","-np","1","--host","/run/ai-core-backend/coder.sock","--port","8080"]
    volumes: ["./models:/models:ro","ai-core-backend-bus:/run/ai-core-backend"]
    cpus: 3
    cpuset: "0-5"
    mem_limit: 9216m
    memswap_limit: 14336m
    restart: "no"

# Shared exclusively by the existing AI Core Gate and model backends.
volumes:
  ai-core-backend-bus:
    name: ai-core-backend-bus
    external: true
